name: Radar Bursa zilnic

on:
  schedule:
    - cron: "0 6 * * 1-5"   # luni-vineri la 06:00 UTC (08:00 ora României)
  workflow_dispatch:         # buton "Run workflow" pentru rulare manuală

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  raport:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rulează botul
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python bot_bursa.py --fara-browser --telegram --iesire site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
